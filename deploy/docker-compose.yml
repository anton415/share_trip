services:
  postgres:
    image: postgres:16
    container_name: sharetrip-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: sharetrip
    ports:
      - "6544:5432"
    volumes:
      - sharetrip_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sharetrip"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  sharetrip_pgdata:
