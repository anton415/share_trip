global:
  scrape_interval: 10s
  scrape_timeout: 5s
  evaluation_interval: 10s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: sharetrip
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:8080

  - job_name: notification
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:8081

  - job_name: kafka
    static_configs:
      - targets:
          - kafka-exporter:9308

  - job_name: postgres
    static_configs:
      - targets:
          - postgres-exporter:9187
