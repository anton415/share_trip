apiVersion: v1
kind: ConfigMap
metadata:
  name: sharetrip-config
  namespace: sharetrip
data:
  HTTP_ADDR: ":8080"
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_USER: "postgres"
  DB_NAME: "sharetrip"
  DB_SSLMODE: "disable"
  CONTRACT_SERVICE_BASE_URL: "http://contract-service:8080"
  CONTRACT_SERVICE_TIMEOUT_MS: "2000"
  CONTRACT_SERVICE_RETRY_COUNT: "2"
  KAFKA_BROKERS: "kafka:9092"
  TRIP_EVENTS_TOPIC: "trip.events"
  KEYCLOAK_ISSUER: "<keycloak-issuer-url>"
  KEYCLOAK_CLIENT_ID: "sharetrip-api"
