---
openapi: 3.0.3
info:
  title: Отклонить заявку на поездку
  version: 1.0.0
  description: 'Проект контрольного задания; операция пока не реализована. Владелец:
    approval'
servers:
- url: https://approval.example.test
security:
- bearerAuth: []
paths:
  "/approvals/{approval_id}/reject":
    post:
      operationId: reject_trip
      summary: Отклонить заявку на поездку
      description: |
        Только назначенный approver_id с действующей ролью руководителя той же компании.
        Область уникальности ключа: (company_id, actor_id, reject_trip, approval_id, Idempotency-Key). Клиент создаёт UUID до первой попытки.
        Результат и hash канонического JSON хранятся в PostgreSQL сервиса: полный ответ 30 суток,
        затем ключ и hash до удаления агрегата. Тот же ключ и тело возвращают исходный статус
        и JSON; другое тело даёт 409 IDEMPOTENCY_KEY_REUSED; старый ключ без тела ответа —
        409 IDEMPOTENCY_KEY_EXPIRED. Проверка полномочий выполняется также перед replay.
        Незавершённый конкурентный запрос после ожидания до 1 секунды даёт 409 REQUEST_IN_PROGRESS.
        Успех и окончательные бизнес-отказы сохраняются; 400/401, отказы авторизации, 404,
        REQUEST_IN_PROGRESS, 429 и технические 5xx не кэшируются. Повторный успех не создаёт событие.
        Ответ, бизнес-изменение и outbox фиксируются одной локальной транзакцией.
        Все решения конкурируют под блокировкой одной заявки. Терминальный статус даёт 409 без нового решения. Истечение срока фиксируется атомарно с ApprovalExpired и ответом 409 APPROVAL_EXPIRED.
      parameters:
      - name: approval_id
        in: path
        required: true
        description: Идентификатор заявки, выданный при отправке.
        schema:
          type: string
          format: uuid
        example: 55555555-5555-4555-8555-555555555555
      - name: Idempotency-Key
        in: header
        required: true
        description: 'UUID одного намерения. Не менять при timeout/retry. Область:
          (company_id, actor_id, reject_trip, approval_id, Idempotency-Key)'
        schema:
          type: string
          format: uuid
        example: 88888888-8888-4888-8888-888888888888
      - name: traceparent
        in: header
        required: false
        description: W3C trace context. Не является ключом идемпотентности.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/Request"
            example:
              reason: Поездка не согласована с графиком отдела.
      responses:
        '200':
          description: Решение и outbox сохранены. Этот ответ не подтверждает публикацию
            поездки или доставку уведомления.
          headers:
            Idempotency-Replayed:
              description: true при возврате сохранённого ответа, false при первом
                выполнении.
              schema:
                type: boolean
            X-Correlation-ID:
              description: Сохранённый идентификатор процесса согласования.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Result"
              example:
                trip_id: 44444444-4444-4444-8444-444444444444
                approval_id: 55555555-5555-4555-8555-555555555555
                correlation_id: 22222222-2222-4222-8222-222222222222
                status: rejected
                updated_at: '2026-10-12T09:05:00Z'
        '400':
          description: 'Некорректные UUID, JSON, обязательные поля или Idempotency-Key.
            Не кэшируется. Коды: INVALID_REQUEST, INVALID_IDEMPOTENCY_KEY.'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              example:
                code: INVALID_REQUEST
                message: Некорректные UUID, JSON, обязательные поля или Idempotency-Key
        '401':
          description: 'Нет действительного Bearer-токена. Не кэшируется. Коды: UNAUTHENTICATED.'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              example:
                code: UNAUTHENTICATED
                message: Нет действительного Bearer-токена
        '403':
          description: 'Недостаточно полномочий для операции. Ошибка авторизации не
            кэшируется. Коды: FORBIDDEN.'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              example:
                code: FORBIDDEN
                message: Недостаточно полномочий для операции
          headers:
            Idempotency-Replayed:
              description: true при возврате сохранённого бизнес-отказа. Не возвращается
                для некэшируемых отказов.
              schema:
                type: boolean
        '404':
          description: 'Заявка не найдена или недоступна в компании пользователя.
            Она может ещё создаваться после 202; ответ не кэшируется, допустим повтор
            того же ключа. Коды: NOT_FOUND.'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              example:
                code: NOT_FOUND
                message: Заявка не найдена или недоступна в компании пользователя
        '409':
          description: 'Конфликт ключа или состояния. REQUEST_IN_PROGRESS допускает
            повтор того же ключа после Retry-After; остальные конфликты не требуют
            автоматического повтора. current_status передаётся при конфликте состояния.
            Коды: IDEMPOTENCY_KEY_REUSED, IDEMPOTENCY_KEY_EXPIRED, REQUEST_IN_PROGRESS,
            APPROVAL_NOT_PENDING, APPROVAL_EXPIRED.'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              example:
                code: IDEMPOTENCY_KEY_REUSED
                message: Конфликт ключа или состояния
          headers:
            Retry-After:
              description: Задержка в секундах. Для 409 присутствует только при REQUEST_IN_PROGRESS
                (1 секунда).
              schema:
                type: integer
                minimum: 1
              example: 1
            Idempotency-Replayed:
              description: true при возврате сохранённого бизнес-отказа. Не возвращается
                для некэшируемых отказов.
              schema:
                type: boolean
        '429':
          description: 'Превышен лимит запросов. Повторить тот же ключ после Retry-After.
            Не кэшируется. Коды: RATE_LIMITED.'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              example:
                code: RATE_LIMITED
                message: Превышен лимит запросов
          headers:
            Retry-After:
              description: Задержка в секундах. Для 409 присутствует только при REQUEST_IN_PROGRESS
                (1 секунда).
              schema:
                type: integer
                minimum: 1
              example: 1
        '500':
          description: 'Внутренняя ошибка; исход commit может быть неизвестен. Повторить
            тот же ключ. Не кэшируется. Коды: INTERNAL_ERROR.'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              example:
                code: INTERNAL_ERROR
                message: Внутренняя ошибка; исход commit может быть неизвестен
        '503':
          description: 'Временно недоступна собственная БД. Повторить тот же ключ
            после Retry-After. Не кэшируется. Коды: DATABASE_UNAVAILABLE.'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              example:
                code: DATABASE_UNAVAILABLE
                message: Временно недоступна собственная БД
          headers:
            Retry-After:
              description: Задержка в секундах. Для 409 присутствует только при REQUEST_IN_PROGRESS
                (1 секунда).
              schema:
                type: integer
                minimum: 1
              example: 1
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Request:
      type: object
      required:
      - reason
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 1000
          pattern: "\\S"
          description: Причина отказа; должна содержать непробельный символ.
      additionalProperties: false
    Result:
      type: object
      required:
      - approval_id
      - trip_id
      - status
      - correlation_id
      - updated_at
      properties:
        approval_id:
          type: string
          format: uuid
        trip_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - rejected
        correlation_id:
          type: string
          format: uuid
        updated_at:
          type: string
          format: date-time
      additionalProperties: false
    Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          enum:
          - INVALID_REQUEST
          - INVALID_IDEMPOTENCY_KEY
          - UNAUTHENTICATED
          - FORBIDDEN
          - NOT_FOUND
          - IDEMPOTENCY_KEY_REUSED
          - IDEMPOTENCY_KEY_EXPIRED
          - REQUEST_IN_PROGRESS
          - APPROVAL_NOT_PENDING
          - APPROVAL_EXPIRED
          - RATE_LIMITED
          - INTERNAL_ERROR
          - DATABASE_UNAVAILABLE
        message:
          type: string
        current_status:
          type: string
          enum:
          - draft
          - approval_pending
          - published
          - started
          - pending
          - approved
          - rejected
          - cancelled
          - expired
      additionalProperties: false
